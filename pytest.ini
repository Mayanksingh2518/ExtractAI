[pytest]
testpaths = tests
pythonpath = .
# Plain `pytest` runs the fast offline tests. Add `-m model`, `-m network`, or `-m ""` for everything.
addopts = -m "not model and not network"
markers =
    model: needs Ollama running with OLLAMA_MODEL pulled (slow: seconds per document)
    network: needs internet access (public test servers, DNS)
filterwarnings =
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
